<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="140" height="400" viewBox="0 0 140 400" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>Lame de Silex Brute</title>
  <desc>Une lame lithique brute de débitage, avant retouche.</desc>
  
  <defs>
    <filter id="flint-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.4 0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0.5 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <path d="M70 15 
           C 100 60, 115 150, 110 380 
           L 30 380 
           C 25 150, 40 60, 70 15 Z" 
        fill="#555555" 
        stroke="#777777" 
        stroke-width="1"
        filter="url(#flint-texture)"/>
        
  <g stroke="#444444" stroke-width="1" fill="none" opacity="0.6">
    <path d="M70 15 C 80 80, 85 180, 80 380"/>
    <path d="M70 15 C 60 80, 55 180, 60 380"/>
    <path d="M78 120 L 95 180"/>
    <path d="M62 160 L 45 220"/>
  </g>
</svg>
