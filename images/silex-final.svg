<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="140" height="400" viewBox="0 0 140 400" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>Retouche de Pointe de Châtelperron</title>
  <desc>La retouche abrupte formant le dos courbe, à superposer à la lame brute.</desc>
  
  <path d="M70 15 
           C 25 80, 25 180, 40 380" 
        fill="none" 
        stroke="#d4af37" 
        stroke-width="4" 
        stroke-linecap="round"
        stroke-dasharray="1, 6, 2, 5, 1, 7" 
        opacity="1">
    <filter id="gold-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </path>
  
  <path d="M68 20 
           C 28 85, 28 185, 42 375" 
        fill="none" 
        stroke="#b08d2e" 
        stroke-width="2" 
        stroke-dasharray="3, 8, 1, 6"/>
</svg>
